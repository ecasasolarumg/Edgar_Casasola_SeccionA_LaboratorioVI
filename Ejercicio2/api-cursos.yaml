openapi: 3.0.3
info:
  title: API Cursos Universitarios
  version: 1.0.0
  description: API RESTful para la administración de cursos universitarios.
paths:
  /api/cursos:
    post:
      summary: Crear un nuevo curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curso'
      responses:
        '201':
          description: Curso creado exitosamente
    get:
      summary: Consultar todos los cursos
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'
  /api/cursos/{codigo}:
    get:
      summary: Consultar curso por código
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso encontrado
        '404':
          description: Curso no encontrado
    put:
      summary: Actualizar curso
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Curso'
      responses:
        '200':
          description: Curso actualizado
        '404':
          description: Curso no encontrado
    delete:
      summary: Eliminar curso
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Curso eliminado
        '404':
          description: Curso no encontrado
components:
  schemas:
    Curso:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        codigo:
          type: string
        creditos:
          type: integer
        estado:
          type: string
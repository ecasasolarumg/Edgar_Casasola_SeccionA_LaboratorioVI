openapi: 3.0.3
info:
  title: API Biblioteca
  version: 1.0.0
paths:
  /api/libros:
    post:
      summary: Registrar un nuevo libro
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Libro' } } } }
      responses: { '201': { description: Libro registrado } }
    get:
      summary: Consultar todos los libros
      responses: { '200': { description: Lista de libros } }
  /api/libros/titulo/{titulo}:
    get:
      summary: Consultar libro por título
      parameters: [{ name: titulo, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Libro encontrado }, '404': { description: No encontrado } }
  /api/libros/{id}:
    put:
      summary: Actualizar libro
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Libro' } } } }
      responses: { '200': { description: Actualizado }, '404': { description: No encontrado } }
    delete:
      summary: Eliminar libro
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { '204': { description: Eliminado }, '404': { description: No encontrado } }
components:
  schemas:
    Libro:
      type: object
      properties: { id: { type: integer }, titulo: { type: string }, autor: { type: string }, isbn: { type: string }, anioPublicacion: { type: integer }, estado: { type: string } }